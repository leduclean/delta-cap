[project]
name = "delta"
version = "0.1.0"
description = "Host-side tooling for the delta robot (calibration, training)"
authors = [
    { name = "Le Duc Léandre", email = "leandre.leduc@etik.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pyserial>=3.5",
]

# Tooling scripts only, not an installable package
[tool.uv]
package = false
